<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>訂餐排班表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            padding-bottom: max(2rem, env(safe-area-inset-bottom)); 
        }

        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            animation: float 10s infinite alternate;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, 30px) scale(1.1); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-700 relative selection:bg-purple-200">

    <!-- 全域 Toast 通知容器 -->
    <div id="toastNotification" class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 transform -translate-y-24 opacity-0 pointer-events-none w-auto min-w-[260px] max-w-[90vw]">
        <div class="bg-slate-800/95 backdrop-blur-md text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700/50">
            <i id="toastIcon" data-lucide="info" class="w-5 h-5 shrink-0"></i>
            <span id="toastMessage" class="text-sm font-bold tracking-wide"></span>
        </div>
    </div>

    <!-- 背景動態光芒 -->
    <div class="blob w-72 h-72 md:w-96 md:h-96 bg-purple-300 opacity-40 top-0 left-0 mix-blend-multiply"></div>
    <div class="blob w-72 h-72 md:w-96 md:h-96 bg-blue-300 opacity-40 top-20 right-0 mix-blend-multiply" style="animation-delay: 2s;"></div>
    <div class="blob w-72 h-72 md:w-96 md:h-96 bg-pink-300 opacity-40 bottom-20 left-10 mix-blend-multiply" style="animation-delay: 4s;"></div>

    <!-- 置頂懸浮選單 -->
    <div class="fixed top-0 left-0 w-full z-50 pointer-events-none px-3 py-2 sm:px-6">
        <div class="max-w-xl mx-auto bg-white/85 backdrop-blur-xl border border-white/80 shadow-sm px-4 py-2.5 rounded-2xl flex items-center justify-between gap-2 pointer-events-auto">
            <!-- 標題 -->
            <h1 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2 shrink-0">
                <i data-lucide="calendar-clock" class="text-purple-600 w-5 h-5"></i>
                <span>訂餐排班表</span>
            </h1>
        
            <!-- 分頁切換按鈕 -->
            <div class="glass-strong p-1 rounded-full flex gap-1 shadow-inner border border-white/90 overflow-x-auto no-scrollbar">
                <a href="#section-schedule" id="nav-schedule" class="px-3.5 py-1 rounded-full text-xs font-bold bg-purple-500 text-white shadow-sm transition-all duration-300 active:scale-95 flex items-center gap-1.5 whitespace-nowrap">
                    <i data-lucide="calendar-check" class="w-3.5 h-3.5"></i> 排班表
                </a>
                <a href="#section-restaurants" id="nav-restaurants" class="px-3.5 py-1 rounded-full text-xs font-bold text-slate-500 hover:text-pink-500 hover:bg-pink-50 transition-all duration-300 active:scale-95 flex items-center gap-1.5 whitespace-nowrap">
                    <i data-lucide="utensils" class="w-3.5 h-3.5"></i> 口袋名單
                </a>
            </div>

            <!-- 重新整理功能 -->
            <button id="refreshBtn" onclick="loadDataFromGASOrLocal();" class="p-2 bg-white hover:bg-purple-50 text-purple-600 rounded-full shadow-sm border border-purple-100 transition-all active:scale-90 shrink-0 flex items-center justify-center">
                <i data-lucide="refresh-cw" id="refreshIcon" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 主要內容區域 -->
    <div class="max-w-xl mx-auto relative z-10 pt-20 px-4 sm:px-6">
        
        <!-- ==================== [區塊 1] 排班表 ==================== -->
        <section id="section-schedule" class="scroll-mt-24 mb-10">
            <div class="flex justify-between items-center mb-4 px-1">
                <div>
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="calendar-check" class="text-purple-600 w-5 h-5"></i> 週三排班
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">顯示當月剩餘週三及下月前 2 週排班資訊</p>
                </div>
                <button onclick="openPastSchedulesModal()" class="px-3 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-xl text-xs font-bold transition-all border border-purple-100 flex items-center gap-1 shrink-0 active:scale-95 shadow-sm">
                    <i data-lucide="history" class="w-3.5 h-3.5"></i> 歷史紀錄
                </button>
            </div>

            <!-- 排班卡片容器 -->
            <div id="schedule-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <!-- JS 動態帶入 -->
            </div>
        </section>

        <!-- 漸層分隔線 -->
        <div class="h-px bg-gradient-to-r from-transparent via-purple-200 to-transparent my-8"></div>

        <!-- ==================== [區塊 2] 口袋名單 ==================== -->
        <section id="section-restaurants" class="scroll-mt-24 mb-12">
            <div class="flex justify-between items-center mb-4 px-1">
                <div>
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="utensils" class="text-pink-500 w-5 h-5"></i> 餐廳推薦
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">大家的美味口袋名單</p>
                </div>
                <button onclick="openRestaurantModal()" class="px-3.5 py-1.5 bg-pink-500 hover:bg-pink-600 text-white rounded-xl text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i> 新增餐廳
                </button>
            </div>

            <!-- 餐廳推薦網格 -->
            <div id="restaurant-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <!-- JS 動態帶入 -->
            </div>
        </section>
    </div>

    <!-- ==================== MODALS ==================== -->

    <!-- 餐廳表單 Modal -->
    <div id="restaurantModal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity p-0 sm:p-4">
        <div class="glass-strong w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-0 overflow-hidden relative flex flex-col max-h-[90vh] shadow-2xl animate-fade-in">
            <div class="h-14 bg-gradient-to-r from-pink-500 to-rose-400 relative flex items-center justify-center shrink-0">
                <h3 id="modalTitleText" class="text-white font-bold text-base">新增推薦餐廳</h3>
                <button onclick="closeRestaurantModal()" class="absolute top-1/2 -translate-y-1/2 right-4 p-1.5 bg-black/10 hover:bg-black/20 rounded-full text-white transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto pb-[max(1.5rem,env(safe-area-inset-bottom))] space-y-4">
                <form id="addRestaurantForm" onsubmit="submitRestaurant(event)" class="space-y-3.5">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">餐廳名稱 <span class="text-rose-500">*</span></label>
                        <input type="text" id="resName" placeholder="例：八方雲集" required class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none text-sm shadow-sm">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">類別標籤 <span class="text-rose-500">*</span></label>
                        <select id="resCategory" onchange="handleCategoryChange()" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none text-sm shadow-sm appearance-none">
                            <option value="麵食" selected>🍜 麵食</option>
                            <option value="健康餐">🥗 健康餐</option>
                            <option value="火鍋">🍲 火鍋</option>
                            <option value="便當">🍱 便當</option>
                            <option value="__custom__">➕ 自訂新類別...</option>
                        </select>
                        <input type="text" id="resCustomCategory" placeholder="輸入自訂類別..." class="hidden w-full px-3.5 py-2.5 mt-2 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none text-sm shadow-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">LINE@ 連結 (選填)</label>
                            <input type="url" id="resLineUrl" placeholder="https://lin.ee/..." class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none text-sm shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">購買方式</label>
                            <select id="resMethod" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none text-sm shadow-sm appearance-none">
                                <option value="店家自送" selected>店家自送</option>
                                <option value="外送 (UberEats/Foodpanda)">外送平台</option>
                                <option value="自取">自取</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">備註 (選填)</label>
                        <textarea id="resNotes" rows="2" placeholder="例：滿500外送、需提早一天預訂" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none text-sm resize-none shadow-sm"></textarea>
                    </div>

                    <button type="submit" id="btnSubmitRestaurant" class="w-full bg-pink-500 text-white py-3 rounded-xl font-bold active:scale-[0.98] transition-transform shadow-md mt-2 flex justify-center items-center gap-2 text-sm">
                        <i data-lucide="save" class="w-4 h-4"></i> 儲存餐廳
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 儲存餐點資訊二次確認 Modal -->
    <div id="confirmFoodModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity p-4">
        <div class="glass-strong w-full max-w-sm rounded-3xl p-5 relative shadow-2xl animate-fade-in">
            <div class="flex flex-col items-center text-center mb-4 mt-1">
                <div class="w-11 h-11 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-2">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">確認儲存餐點？</h3>
                <p class="text-xs text-slate-500 mt-0.5">儲存後將可同步推播通知發送給所有人知悉。</p>
            </div>

            <div class="bg-purple-50/70 border border-purple-100 rounded-2xl p-3.5 mb-4 space-y-1.5 text-xs text-slate-700">
                <div class="flex justify-between">
                    <span class="text-slate-400 font-bold">訂購日期：</span>
                    <span id="confirmFoodDate" class="font-bold"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400 font-bold">負責人：</span>
                    <span id="confirmFoodAssignee" class="font-bold text-purple-700"></span>
                </div>
                <div class="flex justify-between border-t border-purple-100 pt-1.5 mt-1.5">
                    <span class="text-slate-400 font-bold">預計餐點：</span>
                    <span id="confirmFoodName" class="font-bold text-slate-900"></span>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="closeConfirmFoodModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-500 font-bold text-xs rounded-xl hover:bg-slate-200 transition-colors">再想想</button>
                <button onclick="executeSaveFoodInfo()" class="flex-1 py-2.5 bg-purple-600 text-white font-bold text-xs rounded-xl shadow-md hover:bg-purple-700 active:scale-95 transition-transform flex items-center justify-center gap-1">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i> 確認儲存
                </button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div id="pastSchedulesModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity p-4">
        <div class="glass-strong w-full max-w-md rounded-3xl p-5 relative shadow-2xl max-h-[80vh] flex flex-col animate-fade-in">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-200/60">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-purple-600"></i> 過去 4 週歷史紀錄
                </h3>
                <button onclick="closePastSchedulesModal()" class="p-1.5 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-500 transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            
            <div id="past-schedule-list" class="overflow-y-auto space-y-2.5 pr-1 no-scrollbar">
                <!-- 動態填入 -->
            </div>
        </div>
    </div>

    <!-- 密碼驗證 Modal -->
    <div id="passwordModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity p-4">
        <div class="glass-strong w-full max-w-xs rounded-3xl p-5 relative shadow-2xl animate-fade-in">
            <div class="flex flex-col items-center text-center mb-4 mt-1">
                <div class="w-10 h-10 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mb-2">
                    <i data-lucide="lock" class="w-5 h-5"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">需要權限密碼</h3>
                <p class="text-xs text-slate-500 mt-0.5">請輸入通行密碼以執行此操作</p>
            </div>
            
            <input type="password" id="actionPassword" placeholder="輸入密碼..." class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-rose-300 outline-none text-center font-bold tracking-widest text-slate-700 text-sm mb-3">
            
            <div class="flex gap-2">
                <button onclick="closePasswordModal()" class="flex-1 py-2 bg-slate-100 text-slate-500 font-bold text-xs rounded-xl hover:bg-slate-200 transition-colors">取消</button>
                <button onclick="submitPassword()" class="flex-1 py-2 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md hover:bg-rose-600 active:scale-95 transition-transform">確認</button>
            </div>
        </div>
    </div>

    <!-- 身分認領 Modal -->
    <div id="identityModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity p-4">
        <div class="glass-strong w-full max-w-xs rounded-3xl p-5 relative shadow-2xl animate-fade-in">
            <div class="flex flex-col items-center text-center mb-4 mt-1">
                <div class="w-10 h-10 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-2">
                    <i data-lucide="user-check" class="w-5 h-5"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">請輸入您的姓名</h3>
                <p class="text-xs text-slate-500 mt-0.5">系統將會自動記錄，方便日後認領排班。</p>
            </div>
            
            <form onsubmit="submitIdentity(event)">
                <input type="text" id="identityName" required placeholder="例如：王小明" class="w-full px-3.5 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-purple-300 outline-none text-center font-bold text-slate-700 text-sm mb-3">
                
                <div class="flex gap-2">
                    <button type="button" onclick="closeIdentityModal()" class="flex-1 py-2 bg-slate-100 text-slate-500 font-bold text-xs rounded-xl hover:bg-slate-200 transition-colors">取消</button>
                    <button type="submit" class="flex-1 py-2 bg-purple-500 text-white font-bold text-xs rounded-xl shadow-md hover:bg-purple-600 active:scale-95 transition-transform">確認儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // 後端 GAS API 網址
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwl4-pD1TlRe6OTdxJ3V1QrrBGSUCiA5mHeC7YbMn94AgYgyERmmHBr6XJSV0KVBEWbWg/exec'; 
        
        let currentUser = { name: '' };
        let schedules = {}; 
        let restaurants = [];
        let toastTimeout;
        
        let editingRestaurantId = null;
        let foodEditState = {}; 
        let passwordSuccessCallback = null;
        let pendingDateStr = null;
        let pendingActionType = null;
        let pendingFoodSaveDateStr = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadUserData();
            loadDataFromGASOrLocal();

            // Scrollspy 頂部膠囊選單反饋
            const sections = document.querySelectorAll('section');
            const navLinks = {
                'section-schedule': document.getElementById('nav-schedule'),
                'section-restaurants': document.getElementById('nav-restaurants')
            };

            const observerOptions = {
                root: null,
                rootMargin: '-20% 0px -60% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        Object.values(navLinks).forEach(link => {
                            link.classList.remove('bg-purple-500', 'bg-pink-500', 'text-white', 'shadow-sm');
                            link.classList.add('text-slate-500', 'hover:bg-pink-50', 'hover:text-pink-500');
                        });
                        
                        const activeLink = navLinks[entry.target.id];
                        if (activeLink) {
                            activeLink.classList.remove('text-slate-500', 'hover:bg-pink-50', 'hover:text-pink-500');
                            if (entry.target.id === 'section-restaurants') {
                                activeLink.classList.add('bg-pink-500', 'text-white', 'shadow-sm');
                            } else {
                                activeLink.classList.add('bg-purple-500', 'text-white', 'shadow-sm');
                            }
                        }
                    }
                });
            }, observerOptions);

            sections.forEach(section => observer.observe(section));
        });

        function loadUserData() {
            const savedUser = localStorage.getItem('foodOrder_user');
            if (savedUser) {
                try {
                    const parsed = JSON.parse(savedUser);
                    currentUser.name = parsed.name || '';
                } catch(e) {}
            }
        }

        function saveUser() {
            localStorage.setItem('foodOrder_user', JSON.stringify(currentUser));
        }

        async function loadDataFromGASOrLocal() {
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            if (GAS_API_URL && GAS_API_URL.trim() !== '') {
                try {
                    const response = await fetch(GAS_API_URL);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        schedules = result.schedules || {};
                        restaurants = result.restaurants || [];
                        saveSchedulesToLocal();
                        saveRestaurantsToLocal();
                        showToast("雲端資料已同步", "success");
                    } else {
                        throw new Error(result.message || '讀取失敗');
                    }
                } catch (err) {
                    console.warn('GAS Fetch failed, fallback to local:', err);
                    loadLocalData();
                    showToast("已載入預設資料", "info");
                }
            } else {
                loadLocalData();
            }

            if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            renderAll();
        }

        function loadLocalData() {
            const savedSchedules = localStorage.getItem('foodOrder_schedules');
            if (savedSchedules) {
                schedules = JSON.parse(savedSchedules);
            } else {
                const weds = getUpcomingWednesdays();
                if (weds.length > 0) schedules[weds[0]] = { assignee: '王小明', status: 'claimed', foodName: '悟饕池上飯包', unavailables: [] };
                if (weds.length > 1) schedules[weds[1]] = { status: 'unassigned', unavailables: [] }; 
                if (weds.length > 2) schedules[weds[2]] = { assignee: '陳彥中', status: 'claimed', foodName: '', unavailables: [] };
                saveSchedulesToLocal();
            }

            const savedRestaurants = localStorage.getItem('foodOrder_restaurants');
            if (savedRestaurants) {
                restaurants = JSON.parse(savedRestaurants);
            } else {
                restaurants = [
                    { id: 1, name: '八方雲集', category: '麵食', method: '店家自送', notes: '滿300元送，需提早訂', lineUrl: '', timestamp: Date.now() },
                    { id: 2, name: '夏威夷波奇飯', category: '健康餐', method: '外送 (UberEats/Foodpanda)', notes: '', lineUrl: '', timestamp: Date.now() }
                ];
                saveRestaurantsToLocal();
            }
        }

        function saveSchedulesToLocal() {
            localStorage.setItem('foodOrder_schedules', JSON.stringify(schedules));
        }

        function saveRestaurantsToLocal() {
            localStorage.setItem('foodOrder_restaurants', JSON.stringify(restaurants));
        }

        function renderAll() {
            renderSchedule();
            renderRestaurants();

        /**
         * 取得：當月剩餘的所有週三 + 下個月前 2 個週三
         */
        function getUpcomingWednesdays() {
            let dates = [];
            let d = new Date();
            d.setHours(0, 0, 0, 0);
            
            // 找到距離今天最近的週三
            let day = d.getDay();
            let diff = (3 - day + 7) % 7; 
            d.setDate(d.getDate() + diff);

            const currentMonth = d.getMonth();
            const nextMonth = (currentMonth + 1) % 12;
            let nextMonthWedCount = 0;

            while (true) {
                let m = d.getMonth();
                if (m === currentMonth) {
                    const yyyy = d.getFullYear();
                    const mm = String(m + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    dates.push(`${yyyy}-${mm}-${dd}`);
                } else if (m === nextMonth) {
                    if (nextMonthWedCount < 2) {
                        const yyyy = d.getFullYear();
                        const mm = String(m + 1).padStart(2, '0');
                        const dd = String(d.getDate()).padStart(2, '0');
                        dates.push(`${yyyy}-${mm}-${dd}`);
                        nextMonthWedCount++;
                    } else {
                        break;
                    }
                } else {
                    break;
                }
                d.setDate(d.getDate() + 7);
            }
            return dates;
        }

        function getPastWednesdays(weeks = 4) {
            let dates = [];
            let d = new Date();
            d.setHours(0, 0, 0, 0);
            
            let day = d.getDay();
            let diff = (3 - day + 7) % 7; 
            d.setDate(d.getDate() + diff - 7); // 上週三

            for (let i = 0; i < weeks; i++) {
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                dates.push(`${yyyy}-${mm}-${dd}`);
                d.setDate(d.getDate() - 7);
            }
            return dates;
        }

            Object.keys(grouped).forEach(catName => {

        function executeScheduleAction(dateStr, action) {
            if (!schedules[dateStr]) schedules[dateStr] = { status: 'unassigned', unavailables: [] };
            if (!schedules[dateStr].unavailables) schedules[dateStr].unavailables = [];

            if (action === 'claim') {
                schedules[dateStr].assignee = currentUser.name;
                schedules[dateStr].status = 'claimed';
                schedules[dateStr].foodName = '';
                schedules[dateStr].unavailables = schedules[dateStr].unavailables.filter(n => n !== currentUser.name);
                foodEditState[dateStr] = true; 
                showToast("成功認領該週！", "success");
            } else if (action === 'unavailable') {
                if (!schedules[dateStr].unavailables.includes(currentUser.name)) {
                    schedules[dateStr].unavailables.push(currentUser.name);
                }
                showToast("已標記為無法幫忙", "info");
            } else if (action === 'available') {
                schedules[dateStr].unavailables = schedules[dateStr].unavailables.filter(n => n !== currentUser.name);
                showToast("已取消無法幫忙標記", "info");
            } else if (action === 'reset') {
                schedules[dateStr].status = 'unassigned';
                schedules[dateStr].assignee = '';
                schedules[dateStr].foodName = '';
                showToast("已取消認領", "info");
            }

            syncSchedulesToGAS();
            renderAll();

                    </div>
                `;
                list.innerHTML += html;
            });

            document.getElementById('pastSchedulesModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closePastSchedulesModal() {
            document.getElementById('pastSchedulesModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function openPasswordModal(callback) {
            passwordSuccessCallback = callback;
            document.getElementById('actionPassword').value = '';
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            passwordSuccessCallback = null;
        }

        function submitPassword() {
            const pwd = document.getElementById('actionPassword').value;
            if (pwd === 'YSA2026') {
                closePasswordModal();
                if (passwordSuccessCallback) passwordSuccessCallback();
            } else {
                showToast("密碼錯誤，請重新輸入", "error");
            }
        }

        function openIdentityModal() {
            document.getElementById('identityName').value = '';
            document.getElementById('identityModal').classList.remove('hidden');
        }

        function closeIdentityModal() {
            document.getElementById('identityModal').classList.add('hidden');
            pendingDateStr = null;
            pendingActionType = null;
        }

        function submitIdentity(e) {
            e.preventDefault();
            const name = document.getElementById('identityName').value.trim();
            if (name) {
                currentUser.name = name;
                saveUser();
                closeIdentityModal();
                showToast("已認領您的姓名！", "success");
                
                if (pendingDateStr && pendingActionType) {
                    executeScheduleAction(pendingDateStr, pendingActionType);
                    pendingDateStr = null;
                    pendingActionType = null;
                } else {
                    renderAll();
                }
            }
        }

        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.getElementById('toastNotification');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            if (!toast) return;

            toastMessage.textContent = message;
            if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toastIcon.className = "w-5 h-5 shrink-0 text-emerald-400";
            } else if (type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = "w-5 h-5 shrink-0 text-rose-400";
            } else {
                toastIcon.setAttribute('data-lucide', 'info');
                toastIcon.className = "w-5 h-5 shrink-0 text-purple-400";
            }
            lucide.createIcons();

            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-24', 'opacity-0');
            }, duration);
        }
    </script>
</body>
</html>
