<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>訂餐排班表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 強制禁止左右滑動，優化觸控體驗 */
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            padding-bottom: max(2rem, env(safe-area-inset-bottom)); 
        }
        .font-serif {
            font-family: 'Noto Serif TC', serif;
        }
        
        /* 毛玻璃與各類裝飾 */
        .glass {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            animation: float 10s infinite alternate;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, 30px) scale(1.1); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid #a855f7;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-700 relative selection:bg-purple-200">

    <!-- 全域 Toast 通知容器 -->
    <div id="toastNotification" class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] transition-all duration-300 transform -translate-y-24 opacity-0 pointer-events-none w-auto min-w-[260px] max-w-[90vw]">
        <div class="bg-slate-800/95 backdrop-blur-md text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700/50">
            <i id="toastIcon" data-lucide="info" class="w-5 h-5 shrink-0"></i>
            <span id="toastMessage" class="text-sm font-bold tracking-wide"></span>
        </div>
    </div>

    <!-- 背景裝飾 -->
    <div class="blob w-72 h-72 md:w-96 md:h-96 bg-purple-300 opacity-40 top-0 left-0 mix-blend-multiply"></div>
    <div class="blob w-72 h-72 md:w-96 md:h-96 bg-blue-300 opacity-40 top-20 right-0 mix-blend-multiply animation-delay-2000" style="animation-delay: 2s;"></div>
    <div class="blob w-72 h-72 md:w-96 md:h-96 bg-pink-300 opacity-40 bottom-20 left-10 mix-blend-multiply animation-delay-4000" style="animation-delay: 4s;"></div>

    <div class="max-w-xl mx-auto relative z-10 pb-10 pt-20 md:pt-24">
        
        <!-- ==================== 固定的整合式頁首 ==================== -->
        <div class="fixed top-0 left-0 w-full z-50 pointer-events-none">
            <div class="max-w-xl mx-auto bg-white/80 backdrop-blur-xl border-b border-white/50 shadow-sm px-4 py-3 sm:px-6 flex items-center justify-between gap-1 sm:gap-2 rounded-b-2xl pointer-events-auto">
                <!-- 左側：標題 -->
                <h1 class="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-1.5 shrink-0">
                    <i data-lucide="calendar-clock" class="text-purple-600 w-5 h-5 sm:w-6 sm:h-6"></i>
                    <span>訂餐排班表</span>
                </h1>
            
                <!-- 中間：導覽按鈕 -->
                <div class="glass-strong p-1 rounded-full flex gap-0.5 sm:gap-1 shadow-sm border border-white/80 overflow-x-auto no-scrollbar">
                    <a href="#section-schedule" id="nav-schedule" class="px-3 sm:px-5 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-purple-500 text-white shadow-sm transition-all duration-300 active:scale-90 flex items-center gap-1 whitespace-nowrap">
                        <i data-lucide="calendar-check" class="w-3.5 h-3.5"></i> 排班表
                    </a>
                    <a href="#section-restaurants" id="nav-restaurants" class="px-3 sm:px-5 py-1.5 rounded-full text-xs sm:text-sm font-bold text-slate-500 hover:text-pink-500 hover:bg-pink-50 transition-all duration-300 active:scale-90 flex items-center gap-1 whitespace-nowrap">
                        <i data-lucide="utensils" class="w-3.5 h-3.5"></i> 口袋名單
                    </a>
                </div>

                <!-- 右側：重新整理 -->
                <div class="flex items-center gap-1">
                    <button id="refreshBtn" onclick="loadDataFromGASOrLocal();" class="p-2 bg-white/80 hover:bg-white text-purple-600 rounded-full shadow-sm border border-purple-100 transition-colors active:scale-95 shrink-0 flex items-center justify-center">
                        <i data-lucide="refresh-cw" id="refreshIcon" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="px-5 md:px-6">
            
            <!-- ==================== [區塊 1] 排班表 ==================== -->
            <section id="section-schedule" class="scroll-mt-32 mb-10">
                <p class="text-xs text-slate-500 mb-6 px-1 leading-relaxed">點擊「認領」來負責當週訂餐，認領後可填寫預計購買的餐點。若無法幫忙請讓大家知道。</p>

                <div id="schedule-list" class="space-y-4">
                    <!-- 將由 JS 動態填入 -->
                </div>
            </section>

            <!-- 漸層分隔線 -->
            <div class="h-px bg-gradient-to-r from-transparent via-purple-200 to-transparent my-10"></div>

            <!-- ==================== [區塊 2] 口袋名單 ==================== -->
            <section id="section-restaurants" class="scroll-mt-32">
                <div class="flex justify-between items-end mb-6 px-1">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="utensils" class="text-pink-500 w-5 h-5"></i> 餐廳推薦
                        </h2>
                        <p class="text-xs text-slate-500 mt-1">大家推薦的好吃名單</p>
                    </div>
                    <button onclick="openRestaurantModal()" class="px-4 py-2 bg-pink-100 text-pink-600 rounded-xl text-sm font-bold shadow-sm hover:bg-pink-200 active:scale-95 transition-all flex items-center gap-1.5">
                        <i data-lucide="plus" class="w-4 h-4"></i> 新增
                    </button>
                </div>

                <div id="restaurant-list" class="space-y-4">
                    <!-- 將由 JS 動態填入 -->
                </div>
            </section>
        </div>
    </div>

    <!-- 餐廳表單 Modal -->
    <div id="restaurantModal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div class="glass-strong w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-0 overflow-hidden relative flex flex-col max-h-[90vh] shadow-2xl animate-[fadeIn_0.3s_ease-out]">
            <div class="h-16 bg-gradient-to-r from-pink-400 to-rose-400 relative flex items-center justify-center shrink-0">
                <h3 id="modalTitleText" class="text-white font-bold text-lg">新增推薦餐廳</h3>
                <button onclick="closeRestaurantModal()" class="absolute top-1/2 -translate-y-1/2 right-4 p-2 bg-black/10 hover:bg-black/20 rounded-full text-white transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="p-5 sm:p-6 overflow-y-auto pb-[env(safe-area-inset-bottom)]">
                <form id="addRestaurantForm" onsubmit="submitRestaurant(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">餐廳名稱 <span class="text-rose-500">*</span></label>
                            <input type="text" id="resName" placeholder="例：八方雲集" required class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none shadow-sm text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">價格範圍 <span class="text-rose-500">*</span></label>
                            <input type="text" id="resPrice" placeholder="例：$80 - $150" required class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none shadow-sm text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">聯絡電話</label>
                            <input type="tel" id="resPhone" placeholder="例：02-12345678" class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none shadow-sm text-sm">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">推薦品項 <span class="text-rose-500">*</span></label>
                            <input type="text" id="resItems" placeholder="例：排骨飯、雞腿便當" required class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none shadow-sm text-sm">
                        </div>
                        <div class="col-span-2 md:col-span-1">
                            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">LINE@ 連結</label>
                            <input type="url" id="resLineUrl" placeholder="https://lin.ee/..." class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none shadow-sm text-sm">
                        </div>
                        <div class="col-span-2 md:col-span-1">
                            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">購買方式</label>
                            <select id="resMethod" class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none shadow-sm text-sm appearance-none">
                                <option value="店家自送" selected>店家自送</option>
                                <option value="外送 (UberEats/Foodpanda)">外送 (UberEats/Foodpanda)</option>
                                <option value="自取">自取</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">備註 (選填)</label>
                            <textarea id="resNotes" rows="2" placeholder="例：滿500外送、需提早一天訂" class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-pink-300 outline-none shadow-sm text-sm resize-none"></textarea>
                        </div>
                    </div>
                    <button type="submit" id="btnSubmitRestaurant" class="w-full bg-pink-500 text-white py-3.5 rounded-xl font-bold active:scale-[0.98] transition-transform shadow-md mt-4 flex justify-center items-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i> 儲存餐廳
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 密碼驗證 Modal -->
    <div id="passwordModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div class="glass-strong w-11/12 max-w-sm rounded-3xl p-6 relative shadow-2xl animate-[fadeIn_0.3s_ease-out]">
            <div class="flex flex-col items-center text-center mb-5 mt-2">
                <div class="w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mb-3">
                    <i data-lucide="lock" class="w-6 h-6"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800">需要特殊權限</h3>
                <p class="text-xs text-slate-500 mt-1">請輸入密碼以執行此操作</p>
            </div>
            
            <input type="password" id="actionPassword" placeholder="請輸入密碼..." class="w-full px-4 py-3.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-rose-300 outline-none shadow-inner text-center font-bold tracking-widest text-slate-700 mb-4">
            
            <div class="flex gap-3">
                <button onclick="closePasswordModal()" class="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl hover:bg-slate-200 transition-colors">取消</button>
                <button onclick="submitPassword()" class="flex-1 py-3 bg-rose-500 text-white font-bold rounded-xl shadow-md hover:bg-rose-600 active:scale-95 transition-transform">確認</button>
            </div>
        </div>
    </div>

    <!-- 身分驗證 Modal -->
    <div id="identityModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div class="glass-strong w-11/12 max-w-sm rounded-3xl p-6 relative shadow-2xl animate-[fadeIn_0.3s_ease-out]">
            <div class="flex flex-col items-center text-center mb-5 mt-2">
                <div class="w-12 h-12 bg-purple-100 text-purple-500 rounded-full flex items-center justify-center mb-3">
                    <i data-lucide="user" class="w-6 h-6"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800">您是哪位？</h3>
                <p class="text-xs text-slate-500 mt-1">請輸入姓名，系統將自動記住，方便日後認領。</p>
            </div>
            
            <form onsubmit="submitIdentity(event)">
                <input type="text" id="identityName" required placeholder="請輸入您的姓名..." class="w-full px-4 py-3.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-purple-300 outline-none shadow-inner text-center font-bold tracking-widest text-slate-700 mb-4">
                
                <div class="flex gap-3">
                    <button type="button" onclick="closeIdentityModal()" class="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl hover:bg-slate-200 transition-colors">取消</button>
                    <button type="submit" class="flex-1 py-3 bg-purple-500 text-white font-bold rounded-xl shadow-md hover:bg-purple-600 active:scale-95 transition-transform">確認</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // State Management & Configuration
        // ==========================================
        let GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwl4-pD1TlRe6OTdxJ3V1QrrBGSUCiA5mHeC7YbMn94AgYgyERmmHBr6XJSV0KVBEWbWg/exec'; 
        
        let currentUser = { name: '' };
        let schedules = {}; 
        let restaurants = [];
        let toastTimeout;
        
        let editingRestaurantId = null;
        let foodEditState = {}; 
        let passwordSuccessCallback = null;
        let pendingDateStr = null;
        let pendingActionType = null;

        // ==========================================
        // Initialization
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadUserData();
            loadDataFromGASOrLocal();

            // Setup Scrollspy for Top Nav
            const sections = document.querySelectorAll('section');
            const navLinks = {
                'section-schedule': document.getElementById('nav-schedule'),
                'section-restaurants': document.getElementById('nav-restaurants')
            };

            const observerOptions = {
                root: null,
                rootMargin: '-20% 0px -70% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        Object.values(navLinks).forEach(link => {
                            link.classList.remove('bg-purple-500', 'bg-pink-500', 'text-white', 'shadow-sm');
                            link.classList.add('text-slate-500', 'hover:bg-pink-50', 'hover:text-pink-500');
                        });
                        
                        const activeLink = navLinks[entry.target.id];
                        if (activeLink) {
                            activeLink.classList.remove('text-slate-500', 'hover:bg-pink-50', 'hover:text-pink-500');
                            if (entry.target.id === 'section-restaurants') {
                                activeLink.classList.add('bg-pink-500', 'text-white', 'shadow-sm');
                            } else {
                                activeLink.classList.add('bg-purple-500', 'text-white', 'shadow-sm');
                            }
                        }
                    }
                });
            }, observerOptions);

            sections.forEach(section => observer.observe(section));
        });

        // ==========================================
        // Data Loading & Sync with LocalStorage / GAS
        // ==========================================
        function loadUserData() {
            const savedUser = localStorage.getItem('foodOrder_user');
            if (savedUser) {
                const parsed = JSON.parse(savedUser);
                currentUser.name = parsed.name || '';
            }
        }

        function saveUser() {
            localStorage.setItem('foodOrder_user', JSON.stringify(currentUser));
        }

        async function loadDataFromGASOrLocal() {
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            if (GAS_API_URL && GAS_API_URL.trim() !== '') {
                try {
                    const response = await fetch(GAS_API_URL);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        schedules = result.schedules || {};
                        restaurants = result.restaurants || [];
                        saveSchedulesToLocal();
                        saveRestaurantsToLocal();
                        showToast("雲端資料已同步", "success");
                    } else {
                        throw new Error(result.message || '讀取失敗');
                    }
                } catch (err) {
                    console.warn('GAS Fetch failed, fallback to local:', err);
                    loadLocalData();
                    showToast("已從本機載入資料", "info");
                }
            } else {
                loadLocalData();
            }

            if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            renderAll();
        }

        function loadLocalData() {
            const savedSchedules = localStorage.getItem('foodOrder_schedules');
            if (savedSchedules) {
                schedules = JSON.parse(savedSchedules);
            } else {
                const weds = getUpcomingWednesdays(4);
                schedules[weds[0]] = { assignee: '王小明', status: 'claimed', foodName: '悟饕池上飯包', unavailables: [] };
                schedules[weds[1]] = { status: 'unassigned', unavailables: [] }; 
                schedules[weds[2]] = { assignee: '陳彥中', status: 'claimed', foodName: '', unavailables: [] };
                schedules[weds[3]] = { status: 'unassigned', unavailables: ['黃利亞', '林大明'] };
                saveSchedulesToLocal();
            }

            const savedRestaurants = localStorage.getItem('foodOrder_restaurants');
            if (savedRestaurants) {
                restaurants = JSON.parse(savedRestaurants);
            }
        }

        function saveSchedulesToLocal() {
            localStorage.setItem('foodOrder_schedules', JSON.stringify(schedules));
        }

        function saveRestaurantsToLocal() {
            localStorage.setItem('foodOrder_restaurants', JSON.stringify(restaurants));
        }

        async function syncSchedulesToGAS() {
            saveSchedulesToLocal();
            if (!GAS_API_URL || GAS_API_URL.trim() === '') return;

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'saveSchedules', schedules: schedules })
                });
            } catch (err) {
                console.error("Sync Schedules Error:", err);
            }
        }

        async function syncRestaurantsToGAS() {
            saveRestaurantsToLocal();
            if (!GAS_API_URL || GAS_API_URL.trim() === '') return;

            try {
                await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'saveRestaurants', restaurants: restaurants })
                });
            } catch (err) {
                console.error("Sync Restaurants Error:", err);
            }
        }

        function renderAll() {
            renderSchedule();
            renderRestaurants();
        }

        // ==========================================
        // Password Logic
        // ==========================================
        function openPasswordModal(callback) {
            passwordSuccessCallback = callback;
            document.getElementById('actionPassword').value = '';
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            passwordSuccessCallback = null;
        }

        function submitPassword() {
            const pwd = document.getElementById('actionPassword').value;
            if (pwd === 'YSA2026') {
                closePasswordModal();
                if (passwordSuccessCallback) passwordSuccessCallback();
            } else {
                showToast("密碼錯誤，請重新輸入", "error");
            }
        }

        // ==========================================
        // Identity Logic
        // ==========================================
        function openIdentityModal() {
            document.getElementById('identityName').value = '';
            document.getElementById('identityModal').classList.remove('hidden');
        }

        function closeIdentityModal() {
            document.getElementById('identityModal').classList.add('hidden');
            pendingDateStr = null;
            pendingActionType = null;
        }

        function submitIdentity(e) {
            e.preventDefault();
            const name = document.getElementById('identityName').value.trim();
            if (name) {
                currentUser.name = name;
                saveUser();
                closeIdentityModal();
                showToast("已記住您的身分！", "success");
                
                if (pendingDateStr && pendingActionType) {
                    executeScheduleAction(pendingDateStr, pendingActionType);
                    pendingDateStr = null;
                    pendingActionType = null;
                } else {
                    renderAll();
                }
            }
        }

        // ==========================================
        // UI Helpers
        // ==========================================
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.getElementById('toastNotification');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toastIcon.className = "w-5 h-5 shrink-0 text-emerald-400";
            } else if (type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = "w-5 h-5 shrink-0 text-rose-400";
            } else {
                toastIcon.setAttribute('data-lucide', 'info');
                toastIcon.className = "w-5 h-5 shrink-0 text-purple-400";
            }
            lucide.createIcons();

            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-24', 'opacity-0');
            }, duration);
        }

        function getUpcomingWednesdays(weeks = 8) {
            let dates = [];
            let d = new Date();
            d.setHours(0, 0, 0, 0);
            
            let day = d.getDay();
            let diff = (3 - day + 7) % 7; 
            d.setDate(d.getDate() + diff);

            for (let i = 0; i < weeks; i++) {
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                dates.push(`${yyyy}-${mm}-${dd}`);
                d.setDate(d.getDate() + 7);
            }
            return dates;
        }

        // ==========================================
        // Schedule Rendering & Actions
        // ==========================================
        function renderSchedule() {
            const container = document.getElementById('schedule-list');
            container.innerHTML = '';
            const wednesdays = getUpcomingWednesdays(8); 

            wednesdays.forEach(dateStr => {
                const dateObj = new Date(dateStr);
                const displayDate = `${dateObj.getMonth()+1}/${dateObj.getDate()}`;
                const slot = schedules[dateStr] || { status: 'unassigned', unavailables: [] };
                
                const isMe = slot.assignee === currentUser.name;
                const unavailables = slot.unavailables || [];
                const isUnavailable = unavailables.includes(currentUser.name);

                let cardClass = "glass p-5 rounded-2xl shadow-sm transition-all relative overflow-hidden group";
                let contentHtml = '';

                let unavailablesHtml = '';
                if (unavailables.length > 0) {
                    const names = unavailables.map(n => `<span class="line-through decoration-slate-400 opacity-70">${n}</span>`).join('<span class="text-slate-300 mx-1">,</span>');
                    unavailablesHtml = `<div class="mt-4 text-xs text-slate-500 bg-slate-50/80 px-3 py-2 rounded-xl border border-slate-100 flex flex-wrap items-center gap-1.5"><i data-lucide="user-x" class="w-3.5 h-3.5 opacity-70"></i> <span>無法幫忙：</span><div class="flex flex-wrap items-center gap-1 font-medium">${names}</div></div>`;
                }

                if (slot.status === 'unassigned') {
                    cardClass += " border border-slate-200 hover:border-purple-300";
                    contentHtml = `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mt-2 sm:mt-0">
                            <div class="flex items-center gap-3">
                                <div class="bg-slate-100 text-slate-500 rounded-xl p-2.5 flex flex-col items-center justify-center min-w-[60px]">
                                    <span class="text-[10px] font-medium">週三</span>
                                    <span class="text-lg font-bold leading-none mt-0.5">${displayDate}</span>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-700 text-lg">等待認領中</h3>
                                    <p class="text-xs text-slate-400 mt-1">目前無人負責</p>
                                </div>
                            </div>
                            <div class="flex gap-2 w-full sm:w-auto">
                                ${isUnavailable 
                                    ? `<button onclick="actionSchedule('${dateStr}', 'available')" class="flex-1 sm:flex-none px-4 py-2 bg-slate-100/50 text-slate-400 rounded-xl text-sm font-bold text-center border border-slate-200 hover:bg-slate-200 transition-colors active:scale-95">取消標記</button>`
                                    : `<button onclick="actionSchedule('${dateStr}', 'unavailable')" class="flex-1 sm:flex-none px-4 py-2 bg-slate-100 text-slate-500 rounded-xl text-sm font-bold hover:bg-slate-200 transition-colors active:scale-95 text-center border border-slate-200">無法幫忙</button>`
                                }
                                <button onclick="actionSchedule('${dateStr}', 'claim')" class="flex-1 sm:flex-none px-4 py-2 bg-purple-500 text-white rounded-xl text-sm font-bold shadow-md hover:bg-purple-600 transition-colors active:scale-95 text-center flex items-center justify-center gap-1">
                                    <i data-lucide="hand" class="w-4 h-4"></i> 我來認領
                                </button>
                            </div>
                        </div>
                        ${unavailablesHtml}
                    `;
                } else if (slot.status === 'claimed') {
                    if (isMe) {
                        cardClass += " border border-purple-300 bg-gradient-to-br from-white to-purple-50/30 ring-2 ring-purple-100 ring-offset-1";
                        
                        let showEditForm = false;
                        if (foodEditState[dateStr] === true) {
                            showEditForm = true;
                        } else if (foodEditState[dateStr] === undefined && !slot.foodName) {
                            showEditForm = true;
                        }

                        let foodInputHtml = '';
                        if (showEditForm) {
                            foodInputHtml = `
                                <div class="space-y-3 mt-4 animate-[fadeIn_0.3s_ease-out]">
                                    <div class="flex-1">
                                        <label class="block text-[10px] font-bold text-slate-500 mb-1 ml-1">餐點名稱/餐廳</label>
                                        <div class="space-y-2">
                                            <select id="food-select-${dateStr}" onchange="handleFoodSelectChange('${dateStr}')" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-200 focus:ring-2 focus:ring-purple-300 outline-none text-sm appearance-none">
                                                <option value="">從口袋名單選擇...</option>
                                            </select>
                                            <input type="text" id="food-${dateStr}" value="${slot.foodName || ''}" placeholder="或直接輸入其他餐點名稱..." class="w-full px-3 py-2 rounded-lg bg-white border border-slate-200 focus:ring-2 focus:ring-purple-300 outline-none text-sm">
                                        </div>
                                    </div>
                                    <button onclick="saveFoodInfo('${dateStr}')" class="w-full py-2.5 bg-slate-800 text-white rounded-lg text-sm font-bold shadow-sm active:scale-[0.98] transition-transform">儲存餐點資訊</button>
                                </div>
                            `;
                        } else {
                            foodInputHtml = `
                                <div class="bg-white/80 p-3 rounded-xl flex justify-between items-center border border-purple-100 shadow-sm mt-4 animate-[fadeIn_0.3s_ease-out]">
                                    <div>
                                        <p class="text-[10px] text-purple-400 font-bold mb-0.5">預計訂購</p>
                                        <p class="text-base font-bold text-slate-800 leading-tight">${slot.foodName}</p>
                                    </div>
                                    <button onclick="toggleFoodEdit('${dateStr}')" class="p-2.5 bg-purple-50 text-purple-600 rounded-lg hover:bg-purple-100 transition-colors border border-purple-100 active:scale-95">
                                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            `;
                        }

                        contentHtml = `
                            <div class="flex items-start gap-3 border-b border-purple-100/50 pb-3">
                                <div class="bg-purple-500 text-white rounded-xl p-2.5 flex flex-col items-center justify-center min-w-[60px] shadow-sm">
                                    <span class="text-[10px] font-medium opacity-90">週三</span>
                                    <span class="text-lg font-bold leading-none mt-0.5">${displayDate}</span>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center justify-between">
                                        <h3 class="font-bold text-purple-700 text-lg">由我負責</h3>
                                        <button onclick="actionSchedule('${dateStr}', 'reset')" class="text-[10px] font-bold text-slate-400 hover:text-rose-500 transition-colors">取消認領</button>
                                    </div>
                                    <p class="text-xs text-slate-500 mt-0.5">請填寫預計購買的餐點，方便大家了解。</p>
                                </div>
                            </div>
                            ${foodInputHtml}
                            ${unavailablesHtml}
                        `;
                    } else {
                        cardClass += " border border-indigo-100 bg-white/80";
                        contentHtml = `
                            <div class="flex items-center justify-between gap-4">
                                <div class="flex items-center gap-3">
                                    <div class="bg-indigo-50 text-indigo-600 rounded-xl p-2.5 flex flex-col items-center justify-center min-w-[60px] border border-indigo-100">
                                        <span class="text-[10px] font-medium">週三</span>
                                        <span class="text-lg font-bold leading-none mt-0.5">${displayDate}</span>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-slate-700">${slot.assignee}</h3>
                                        <p class="text-sm font-bold text-indigo-600 mt-1">${slot.foodName || '尚未決定餐點'}</p>
                                    </div>
                                </div>
                            </div>
                            ${unavailablesHtml}
                        `;
                    }
                }

                container.innerHTML += `<div class="${cardClass}">${contentHtml}</div>`;
            });
            
            // 填入所有餐廳下拉式選單選項
            wednesdays.forEach(dateStr => {
                const selectEl = document.getElementById(`food-select-${dateStr}`);
                if (selectEl) {
                    restaurants.forEach(res => {
                        const opt = document.createElement('option');
                        opt.value = res.name;
                        opt.textContent = `${res.name} (${res.items})`;
                        selectEl.appendChild(opt);
                    });
                }
            });

            lucide.createIcons();
        }

        function handleFoodSelectChange(dateStr) {
            const selectEl = document.getElementById(`food-select-${dateStr}`);
            const inputEl = document.getElementById(`food-${dateStr}`);
            if (selectEl && selectEl.value) {
                inputEl.value = selectEl.value;
            }
        }

        function actionSchedule(dateStr, action) {
            if (!currentUser.name) {
                pendingDateStr = dateStr;
                pendingActionType = action;
                openIdentityModal();
                return;
            }
            
            executeScheduleAction(dateStr, action);
        }

        function executeScheduleAction(dateStr, action) {
            if (!schedules[dateStr]) schedules[dateStr] = { status: 'unassigned', unavailables: [] };
            if (!schedules[dateStr].unavailables) schedules[dateStr].unavailables = [];

            if (action === 'claim') {
                schedules[dateStr].assignee = currentUser.name;
                schedules[dateStr].status = 'claimed';
                schedules[dateStr].foodName = '';
                
                schedules[dateStr].unavailables = schedules[dateStr].unavailables.filter(n => n !== currentUser.name);
                foodEditState[dateStr] = true; 
                showToast("認領成功！請填寫餐點資訊。", "success");
            } else if (action === 'unavailable') {
                if (!schedules[dateStr].unavailables.includes(currentUser.name)) {
                    schedules[dateStr].unavailables.push(currentUser.name);
                }
                showToast("已標記為無法幫忙", "info");
            } else if (action === 'available') {
                schedules[dateStr].unavailables = schedules[dateStr].unavailables.filter(n => n !== currentUser.name);
                showToast("已取消無法幫忙標記", "info");
            } else if (action === 'reset') {
                schedules[dateStr].status = 'unassigned';
                schedules[dateStr].assignee = '';
                schedules[dateStr].foodName = '';
                showToast("已取消認領該週", "info");
            }

            syncSchedulesToGAS();
            renderAll();
        }

        function toggleFoodEdit(dateStr) {
            foodEditState[dateStr] = !foodEditState[dateStr];
            renderSchedule();
        }

        function saveFoodInfo(dateStr) {
            const food = document.getElementById(`food-${dateStr}`).value.trim();
            
            if (!food) {
                showToast("請填寫餐點名稱！", "error");
                return;
            }

            if(schedules[dateStr] && schedules[dateStr].assignee === currentUser.name) {
                schedules[dateStr].foodName = food;
                delete schedules[dateStr].qty; 
                foodEditState[dateStr] = false; 
                syncSchedulesToGAS();
                showToast("餐點資訊已儲存！", "success");
                renderAll(); 
            }
        }

        // ==========================================
        // Restaurants Rendering & Logic
        // ==========================================
        function renderRestaurants() {
            const container = document.getElementById('restaurant-list');
            container.innerHTML = '';

            if (restaurants.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 text-sm py-8">目前還沒有推薦餐廳，快來新增吧！</p>';
                return;
            }

            restaurants.forEach(res => {
                const html = `
                    <div class="glass p-5 rounded-2xl shadow-sm border border-pink-100 flex flex-col gap-3 relative overflow-hidden group">
                        <div class="absolute -right-4 -bottom-4 opacity-[0.03] group-hover:scale-110 transition-transform duration-500 pointer-events-none">
                            <i data-lucide="utensils" class="w-32 h-32 text-pink-900"></i>
                        </div>
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800 text-lg">${res.name}</h3>
                            <span class="text-xs font-bold text-pink-600 bg-pink-50 px-2 py-1 rounded-md border border-pink-100">${res.price}</span>
                        </div>
                        <div class="space-y-1.5 text-sm relative z-10">
                            <p class="flex items-start gap-2 text-slate-600">
                                <i data-lucide="check-circle" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"></i>
                                <span><span class="font-bold text-slate-500 mr-1">推薦:</span>${res.items}</span>
                            </p>
                            <p class="flex items-start gap-2 text-slate-600">
                                <i data-lucide="truck" class="w-4 h-4 text-blue-500 shrink-0 mt-0.5"></i>
                                <span><span class="font-bold text-slate-500 mr-1">方式:</span>${res.method}</span>
                            </p>
                            ${res.phone ? `
                            <p class="flex items-start gap-2 text-slate-600 mt-1">
                                <i data-lucide="phone" class="w-4 h-4 text-slate-400 shrink-0 mt-0.5"></i>
                                <span>${res.phone}</span>
                            </p>` : ''}

                            ${res.notes ? `
                            <p class="flex items-start gap-2 text-slate-600 bg-white/50 p-2 rounded-lg border border-slate-100 mt-2 text-xs">
                                <i data-lucide="info" class="w-3.5 h-3.5 text-amber-500 shrink-0 mt-0.5"></i>
                                <span>${res.notes}</span>
                            </p>
                            ` : ''}

                            <div class="flex gap-2 mt-3 pt-2 border-t border-slate-100/50">
                                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(res.name)}" target="_blank" class="flex-1 flex justify-center items-center gap-1 bg-green-50 text-green-600 py-2 rounded-lg text-xs font-bold border border-green-100 hover:bg-green-100 transition shadow-sm active:scale-95"><i data-lucide="map" class="w-3.5 h-3.5"></i> Google Map</a>
                                ${res.lineUrl ? `<a href="${res.lineUrl}" target="_blank" class="flex-1 flex justify-center items-center gap-1 bg-[#06C755]/10 text-[#06C755] py-2 rounded-lg text-xs font-bold border border-[#06C755]/20 hover:bg-[#06C755]/20 transition shadow-sm active:scale-95"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i> LINE@</a>` : ''}
                            </div>
                        </div>
                        <div class="absolute top-3 right-3 flex flex-col gap-1.5 z-20">
                            <button onclick="attemptEditRestaurant(${res.id})" class="p-1.5 bg-white/90 text-slate-500 rounded-md hover:bg-slate-100 hover:text-purple-600 border border-slate-200 shadow-sm transition-colors opacity-70 hover:opacity-100">
                                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="deleteRestaurant(${res.id})" class="p-1.5 bg-rose-50/90 text-rose-400 rounded-md hover:bg-rose-100 hover:text-rose-600 border border-rose-100 shadow-sm transition-colors opacity-70 hover:opacity-100">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
            lucide.createIcons();
        }

        function openRestaurantModal(isEdit = false, resData = null) {
            const form = document.getElementById('addRestaurantForm');
            const titleText = document.getElementById('modalTitleText');
            
            if (isEdit && resData) {
                editingRestaurantId = resData.id;
                titleText.textContent = "編輯推薦餐廳";
                document.getElementById('resName').value = resData.name || '';
                document.getElementById('resPrice').value = resData.price || '';
                document.getElementById('resPhone').value = resData.phone || '';
                document.getElementById('resLineUrl').value = resData.lineUrl || '';
                document.getElementById('resItems').value = resData.items || '';
                document.getElementById('resMethod').value = resData.method || '店家自送';
                document.getElementById('resNotes').value = resData.notes || '';
                
                document.getElementById('btnSubmitRestaurant').innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> 儲存修改';
            } else {
                editingRestaurantId = null;
                titleText.textContent = "新增推薦餐廳";
                form.reset();
                document.getElementById('btnSubmitRestaurant').innerHTML = '<i data-lucide="plus-circle" class="w-5 h-5"></i> 新增至口袋名單';
            }
            
            document.getElementById('restaurantModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeRestaurantModal() {
            document.getElementById('restaurantModal').classList.add('hidden');
            document.body.style.overflow = '';
            editingRestaurantId = null;
        }

        function attemptEditRestaurant(id) {
            const res = restaurants.find(r => r.id === id);
            if (!res) return;
            
            const timePassed = Date.now() - (res.timestamp || 0);
            if (timePassed > 600000) {
                openPasswordModal(() => {
                    openRestaurantModal(true, res);
                });
            } else {
                openRestaurantModal(true, res);
            }
        }

        function submitRestaurant(e) {
            e.preventDefault();
            const newRes = {
                id: editingRestaurantId || Date.now(),
                name: document.getElementById('resName').value.trim(),
                price: document.getElementById('resPrice').value.trim(),
                phone: document.getElementById('resPhone').value.trim(),
                lineUrl: document.getElementById('resLineUrl').value.trim(),
                items: document.getElementById('resItems').value.trim(),
                method: document.getElementById('resMethod').value,
                notes: document.getElementById('resNotes').value.trim(),
                timestamp: Date.now()
            };

            if (editingRestaurantId) {
                const index = restaurants.findIndex(r => r.id === editingRestaurantId);
                if (index !== -1) {
                    restaurants[index] = newRes;
                    showToast("餐廳資料已更新！", "success");
                }
            } else {
                restaurants.unshift(newRes);
                showToast("已成功新增推薦餐廳！", "success");
            }

            syncRestaurantsToGAS();
            renderRestaurants();
            closeRestaurantModal();
        }

        function deleteRestaurant(id) {
            restaurants = restaurants.filter(r => r.id !== id);
            syncRestaurantsToGAS();
            renderRestaurants();
            showToast("已刪除餐廳", "info");
        }
    </script>
</body>
</html>
