<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>單成中心-成員一覽</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, 30px) scale(1.1); }
        }
        .blob {
            position: absolute; 
            border-radius: 50%; 
            filter: blur(60px); 
            z-index: -1; 
            animation: float 10s infinite alternate;
        }
        .glass {
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .sticky-header {
            position: sticky; 
            top: 0; 
            z-index: 40; 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%); 
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }
        
        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-700 relative pb-20">

    <!-- 背景氣泡 -->
    <div class="blob w-72 h-72 bg-purple-300 opacity-30 top-0 left-0"></div>
    <div class="blob w-72 h-72 bg-blue-300 opacity-30 top-20 right-0" style="animation-delay: 2s;"></div>
    <div class="blob w-72 h-72 bg-pink-300 opacity-30 bottom-20 left-10" style="animation-delay: 4s;"></div>

    <div class="max-w-2xl mx-auto px-5 relative z-10">
        
        <!-- Sticky Header (加上 id 與過渡動畫) -->
        <header id="mainHeader" class="sticky-header pt-16 pb-12 flex flex-col items-center text-center transition-all duration-300">
            <h1 id="mainTitle" class="text-3xl font-black text-slate-800 tracking-tighter mb-2 transition-all duration-300">單成中心-成員一覽</h1>
            
            <!-- 名言佳句 (加上 id 與高度過渡控制) -->
            <p id="quoteText" class="text-slate-500 text-xs font-serif-tc italic leading-relaxed px-4 mb-4 overflow-hidden max-h-[200px] opacity-100 transition-all duration-500">
                「我另外有羊，不是這圈裡的；我必須領他們來，他們也要聽我的聲音，<br>並且要合成一群，歸一個牧人了。」<br>—— 約翰福音 10:16
            </p>
            
            <!-- 回主頁按鈕 -->
            <a href="https://weichun0203.github.io/YSA-institute/" class="inline-flex items-center gap-2 px-5 py-2 glass hover:bg-white/90 text-purple-600 rounded-full text-xs font-bold shadow-sm transition-all">
                <i data-lucide="home" class="w-4 h-4"></i> 回主頁
            </a>
        </header>

        <!-- Search & Actions -->
        <div class="flex flex-col gap-4 mb-8">
            <div class="relative group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-purple-500 transition-colors"></i>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="搜尋組織單位或人員..."
                    class="w-full pl-12 pr-6 py-4 glass rounded-2xl focus:outline-none focus:ring-4 focus:ring-purple-200 border-white/80 shadow-xl transition-all placeholder:text-slate-400 font-medium"
                >
            </div>
            <button 
                onclick="openModal('view-leaders')"
                class="w-full flex items-center justify-center gap-2 py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-2xl font-bold shadow-lg active:scale-[0.98] transition-all"
            >
                <i data-lucide="award" class="w-5 h-5"></i> 查看組織領袖分工
            </button>
        </div>

        <!-- Tree Container -->
        <div id="treeContainer" class="space-y-6">
            <!-- 內容由 JavaScript 動態渲染 -->
        </div>

        <!-- Footer -->
        <footer class="mt-16 text-center">
            <p class="text-slate-400 text-[10px] font-bold tracking-widest uppercase mb-1">Organization Management System</p>
            <p class="text-slate-300 text-[9px]">Ver 4.0.0 • 青年單身成人中心</p>
        </footer>
    </div>

    <!-- Modal (彈出視窗) -->
    <div id="actionModal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative glass-strong w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2.5rem] overflow-hidden shadow-2xl transform transition-transform duration-300 translate-y-10 sm:translate-y-0" id="modalContent">
            
            <!-- Modal Header -->
            <div class="h-24 bg-gradient-to-r from-purple-600 to-indigo-600 relative flex items-center justify-center shrink-0">
               <div class="absolute inset-0 bg-white opacity-10" style="background-image: radial-gradient(circle, #fff 1px, transparent 1.5px); background-size: 15px 15px;"></div>
               <h3 id="modalTitle" class="text-white font-black text-xl relative z-10 tracking-tight">標題</h3>
               <button onclick="closeModal()" class="absolute top-1/2 -translate-y-1/2 right-6 p-2 bg-black/10 hover:bg-black/20 rounded-full text-white transition-colors z-20">
                  <i data-lucide="x" class="w-5 h-5"></i>
               </button>
            </div>
            
            <form id="actionForm" class="p-8 space-y-6" onsubmit="handleSubmit(event)">
                
                <!-- 單位名稱輸入框 (新增聯會/支會時顯示) -->
                <div id="fieldOrgName" class="space-y-2 hidden">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">單位名稱</label>
                    <input type="text" id="inputOrgName" placeholder="請輸入名稱..." class="w-full px-5 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-purple-500/10 focus:bg-white transition-all outline-none font-bold">
                </div>

                <!-- 人員資料輸入框 (新增/編輯人員時顯示) -->
                <div id="fieldMemberData" class="space-y-6 hidden">
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">人員姓名</label>
                        <input type="text" id="inputName" placeholder="請輸入姓名..." class="w-full px-5 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-purple-500/10 focus:bg-white transition-all outline-none font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">職業標籤</label>
                        <input type="text" id="inputJob" placeholder="輸入職業..." class="w-full px-5 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-purple-500/10 focus:bg-white transition-all outline-none font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">領袖職位 (選填)</label>
                        <input type="text" id="inputRole" placeholder="例如：會長、主教..." class="w-full px-5 py-4 bg-amber-50/50 border border-amber-200 rounded-2xl focus:ring-4 focus:ring-amber-500/10 focus:bg-white transition-all outline-none font-bold text-amber-700 placeholder:text-amber-300">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">年齡區間</label>
                        <select id="inputAge" class="w-full px-5 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-purple-500/10 focus:bg-white transition-all outline-none font-bold appearance-none cursor-pointer">
                            <option value="" disabled selected>請選擇年齡區間</option>
                            <option value="18-23">18-23 歲</option>
                            <option value="23-30">23-30 歲</option>
                            <option value="30-35">30-35 歲</option>
                        </select>
                    </div>
                </div>

                <!-- 組織領袖分工表 (查看時顯示) -->
                <div id="fieldLeadersView" class="hidden max-h-[50vh] overflow-y-auto no-scrollbar pb-4 space-y-4">
                    <!-- 動態渲染 -->
                </div>

                <div id="formButtons" class="mt-10 flex gap-4 pb-2 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 py-4 bg-slate-100 text-slate-500 font-black rounded-2xl hover:bg-slate-200 transition-all active:scale-95">取消</button>
                    <button type="submit" class="flex-1 py-4 bg-slate-800 text-white font-black rounded-2xl hover:bg-slate-900 shadow-xl shadow-slate-200 transition-all active:scale-95">確認提交</button>
                </div>
                
                <div id="viewButtons" class="hidden mt-6 pb-2 pt-2">
                    <button type="button" onclick="closeModal()" class="w-full py-4 bg-slate-800 text-white font-black rounded-2xl hover:bg-slate-900 shadow-xl shadow-slate-200 transition-all active:scale-95">關閉</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 初始資料設定 ---
        let orgData = [
            {
                id: 'branch-ty',
                name: '桃園分支聯會',
                children: [
                    { id: 'ty-ty', name: '桃園支會', members: [{ name: '張志明', job: '軟體工程師', age: '23-30', role: '主教' }, { name: '王美玲', job: '教師', age: '30-35', role: '慈助會會長' }] },
                    { id: 'ty-lt', name: '龍潭支會', members: [{ name: '林木森', job: '公務員', age: '30-35' }] },
                    { id: 'ty-zl', name: '中壢支會', members: [{ name: '郭子乾', job: '演藝人員', age: '23-30' }] },
                    { id: 'ty-lz', name: '蘆竹支會', members: [{ name: '趙又廷', job: '演員', age: '30-35' }] },
                    { id: 'ty-ks', name: '龜幼支會', members: [{ name: '孫悟空', job: '保全人員', age: '18-23' }] },
                    { id: 'ty-bd', name: '八德支會', members: [{ name: '蔡依林', job: '歌手', age: '23-30' }] },
                ]
            },
            {
                id: 'branch-hc',
                name: '新竹分支聯會',
                children: [
                    { id: 'hc-z1', name: '竹一支會', members: [{ name: '劉德華', job: '藝術總監', age: '30-35', role: '長老定額組會長' }] },
                    { id: 'hc-z3', name: '竹三支會', members: [{ name: '金城武', job: '產品開發', age: '30-35' }] },
                    { id: 'hc-zb', name: '竹北支會', members: [{ name: '彭于晏', job: '健身教練', age: '23-30' }] },
                    { id: 'hc-zn', name: '竹南支會', members: [{ name: '張曼玉', job: '行政主管', age: '30-35' }] },
                    { id: 'hc-ml', name: '苗栗支會', members: [{ name: '舒淇', job: '行銷經理', age: '23-30' }] },
                ]
            },
            {
                id: 'branch-other-stake',
                name: '其他(支聯會)',
                children: [
                    { id: 'other-tpe', name: '台北', members: [{ name: '林依晨', job: '演員', age: '30-35', role: '活動委員' }, { name: '陳柏霖', job: '演員', age: '30-35' }, { name: '王淨', job: '演員', age: '23-30' }] }
                ]
            }
        ];

        // --- 狀態管理 ---
        let expandedNodes = new Set(['branch-ty', 'branch-hc', 'branch-other-stake']);
        let searchTerm = '';
        let currentModalConfig = {
            mode: '', // 'add-branch', 'add-sub-branch', 'add-member', 'edit-member', 'view-leaders'
            parentId: null,
            targetIdx: null
        };

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            renderTree();
            lucide.createIcons();
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                renderTree();
            });

            // --- 滾動偵測：縮小標題與隱藏名言 ---
            const mainHeader = document.getElementById('mainHeader');
            const mainTitle = document.getElementById('mainTitle');
            const quoteText = document.getElementById('quoteText');
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 40) {
                    // 向下捲動時：縮小 Header 內距與隱藏名言
                    mainHeader.classList.remove('pt-16', 'pb-12');
                    mainHeader.classList.add('pt-6', 'pb-4');
                    
                    mainTitle.classList.remove('text-3xl', 'mb-2');
                    mainTitle.classList.add('text-2xl', 'mb-3');
                    
                    quoteText.classList.remove('max-h-[200px]', 'opacity-100', 'mb-4');
                    quoteText.classList.add('max-h-0', 'opacity-0', 'mb-0');
                } else {
                    // 回到最頂端時：恢復原本大小與顯示名言
                    mainHeader.classList.remove('pt-6', 'pb-4');
                    mainHeader.classList.add('pt-16', 'pb-12');
                    
                    mainTitle.classList.remove('text-2xl', 'mb-3');
                    mainTitle.classList.add('text-3xl', 'mb-2');
                    
                    quoteText.classList.remove('max-h-0', 'opacity-0', 'mb-0');
                    quoteText.classList.add('max-h-[200px]', 'opacity-100', 'mb-4');
                }
            });
        });

        // --- 切換展開/折疊 ---
        function toggleNode(id) {
            if (expandedNodes.has(id)) {
                expandedNodes.delete(id);
            } else {
                expandedNodes.add(id);
            }
            renderTree();
        }

        // --- 開啟 Modal ---
        function openModal(mode, parentId = null, targetIdx = null) {
            currentModalConfig = { mode, parentId, targetIdx };
            const modal = document.getElementById('actionModal');
            const modalContent = document.getElementById('modalContent');
            const titleEl = document.getElementById('modalTitle');
            
            // 欄位顯示控制
            const fieldOrg = document.getElementById('fieldOrgName');
            const fieldMember = document.getElementById('fieldMemberData');
            const fieldLeaders = document.getElementById('fieldLeadersView');
            const formButtons = document.getElementById('formButtons');
            const viewButtons = document.getElementById('viewButtons');
            
            const inputOrgName = document.getElementById('inputOrgName');
            const inputName = document.getElementById('inputName');
            const inputJob = document.getElementById('inputJob');
            const inputRole = document.getElementById('inputRole');
            const inputAge = document.getElementById('inputAge');

            // 預設隱藏所有區塊
            fieldOrg.classList.add('hidden');
            fieldMember.classList.add('hidden');
            fieldLeaders.classList.add('hidden');
            formButtons.classList.add('hidden');
            viewButtons.classList.add('hidden');

            // 清空資料
            inputOrgName.value = '';
            inputName.value = '';
            inputJob.value = '';
            inputRole.value = '';
            inputAge.value = '';
            inputOrgName.required = false;
            inputName.required = false;
            inputJob.required = false;
            inputAge.required = false;

            if (mode === 'add-branch') {
                titleEl.textContent = '新增分支聯會';
                fieldOrg.classList.remove('hidden');
                formButtons.classList.remove('hidden');
                inputOrgName.required = true;
                setTimeout(() => inputOrgName.focus(), 100);
            } 
            else if (mode === 'add-sub-branch') {
                titleEl.textContent = '新增支會單位';
                fieldOrg.classList.remove('hidden');
                formButtons.classList.remove('hidden');
                inputOrgName.required = true;
                setTimeout(() => inputOrgName.focus(), 100);
            } 
            else if (mode === 'add-member') {
                titleEl.textContent = '新增人員資料';
                fieldMember.classList.remove('hidden');
                formButtons.classList.remove('hidden');
                inputName.required = true;
                inputJob.required = true;
                inputAge.required = true;
                setTimeout(() => inputName.focus(), 100);
            } 
            else if (mode === 'edit-member') {
                titleEl.textContent = '編輯人員資料';
                fieldMember.classList.remove('hidden');
                formButtons.classList.remove('hidden');
                inputName.required = true;
                inputJob.required = true;
                inputAge.required = true;
                
                // 尋找並填入舊資料
                let foundMember = null;
                orgData.forEach(branch => {
                    const sub = branch.children.find(s => s.id === parentId);
                    if (sub && sub.members[targetIdx]) {
                        foundMember = sub.members[targetIdx];
                    }
                });

                if (foundMember) {
                    inputName.value = foundMember.name;
                    inputJob.value = foundMember.job;
                    inputRole.value = foundMember.role || '';
                    inputAge.value = foundMember.age || '';
                }
                setTimeout(() => inputName.focus(), 100);
            }
            else if (mode === 'view-leaders') {
                titleEl.textContent = '組織領袖分工表';
                fieldLeaders.classList.remove('hidden');
                viewButtons.classList.remove('hidden');

                // 產生領袖列表
                let leadersHtml = '';
                orgData.forEach(branch => {
                    branch.children.forEach(sub => {
                        const leaders = (sub.members || []).filter(m => m.role && m.role.trim() !== '');
                        if (leaders.length > 0) {
                            leadersHtml += `<div class="mb-5">
                                <h4 class="font-bold text-slate-800 mb-2 px-1 flex items-center gap-2"><i data-lucide="map-pin" class="w-4 h-4 text-purple-500"></i>${branch.name} - ${sub.name}</h4>
                                <ul class="space-y-2">`;
                            leaders.forEach(l => {
                                leadersHtml += `<li class="flex justify-between items-center bg-white/60 p-3 rounded-xl border border-slate-100 shadow-sm">
                                    <span class="font-bold text-slate-700 text-sm">${l.name}</span>
                                    <span class="text-[11px] font-bold bg-amber-100 text-amber-700 px-2.5 py-1 rounded-md flex items-center gap-1"><i data-lucide="award" class="w-3 h-3"></i>${l.role}</span>
                                </li>`;
                            });
                            leadersHtml += `</ul></div>`;
                        }
                    });
                });
                if(!leadersHtml) leadersHtml = '<p class="text-center text-slate-400 py-6 font-bold">目前尚未設定任何領袖</p>';
                fieldLeaders.innerHTML = leadersHtml;
            }

            // 顯示動畫
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('translate-y-10');
            }, 10);
        }

        // --- 關閉 Modal ---
        function closeModal() {
            const modal = document.getElementById('actionModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.add('opacity-0');
            modalContent.classList.add('translate-y-10');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // --- 表單送出處理 ---
        function handleSubmit(e) {
            e.preventDefault();
            
            if (currentModalConfig.mode === 'view-leaders') return;

            const newId = `id-${Date.now()}`;
            const orgNameVal = document.getElementById('inputOrgName').value.trim();
            const nameVal = document.getElementById('inputName').value.trim();
            const jobVal = document.getElementById('inputJob').value.trim();
            const roleVal = document.getElementById('inputRole').value.trim();
            const ageVal = document.getElementById('inputAge').value;

            if (currentModalConfig.mode === 'add-branch') {
                if(!orgNameVal) return;
                orgData.push({ id: newId, name: orgNameVal, children: [] });
                expandedNodes.add(newId);
            } 
            else if (currentModalConfig.mode === 'add-sub-branch') {
                if(!orgNameVal) return;
                const branch = orgData.find(b => b.id === currentModalConfig.parentId);
                if (branch) {
                    branch.children.push({ id: newId, name: orgNameVal, members: [] });
                    expandedNodes.add(newId);
                    expandedNodes.add(branch.id);
                }
            } 
            else if (currentModalConfig.mode === 'add-member') {
                if(!nameVal || !jobVal || !ageVal) return;
                orgData.forEach(branch => {
                    const sub = branch.children.find(s => s.id === currentModalConfig.parentId);
                    if (sub) {
                        if (!sub.members) sub.members = [];
                        sub.members.push({ name: nameVal, job: jobVal, age: ageVal, role: roleVal });
                        expandedNodes.add(sub.id);
                        expandedNodes.add(branch.id);
                    }
                });
            } 
            else if (currentModalConfig.mode === 'edit-member') {
                if(!nameVal || !jobVal || !ageVal) return;
                orgData.forEach(branch => {
                    const sub = branch.children.find(s => s.id === currentModalConfig.parentId);
                    if (sub && sub.members[currentModalConfig.targetIdx]) {
                        sub.members[currentModalConfig.targetIdx] = { name: nameVal, job: jobVal, age: ageVal, role: roleVal };
                    }
                });
            }

            renderTree();
            closeModal();
        }

        // --- 渲染樹狀圖 ---
        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            // 搜尋過濾邏輯
            let filteredData = orgData;
            if (searchTerm) {
                filteredData = orgData.map(branch => {
                    const filteredSubBranches = branch.children.map(sub => {
                        const members = sub.members || [];
                        const filteredMembers = members.filter(m => 
                            m.name.includes(searchTerm) || m.job.includes(searchTerm) || sub.name.includes(searchTerm)
                        );
                        if (sub.name.includes(searchTerm) || filteredMembers.length > 0) {
                            return { ...sub, members: filteredMembers };
                        }
                        return null;
                    }).filter(Boolean);

                    if (branch.name.includes(searchTerm) || filteredSubBranches.length > 0) {
                        return { ...branch, children: filteredSubBranches };
                    }
                    return null;
                }).filter(Boolean);
            }

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white/40 rounded-[2.5rem] border border-white/80 shadow-xl">
                        <p class="text-slate-500 font-bold">找不到符合條件的搜尋結果</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // 組合 HTML 結構
            let htmlStr = '';

            filteredData.forEach(branch => {
                const isExp = expandedNodes.has(branch.id);
                const total = branch.children.reduce((acc, curr) => acc + (curr.members?.length || 0), 0);
                
                let subHtml = '';
                if (isExp) {
                    if (branch.children.length === 0) {
                        subHtml = `<p class="text-center py-8 text-slate-400 text-xs italic">尚無支會單位</p>`;
                    } else {
                        branch.children.forEach(sub => {
                            const subExp = expandedNodes.has(sub.id);
                            const memCount = sub.members ? sub.members.length : 0;
                            
                            let memHtml = '';
                            if (subExp) {
                                if (memCount === 0) {
                                    memHtml = `<p class="text-center py-4 text-[10px] text-slate-400">尚無人員</p>`;
                                } else {
                                    sub.members.forEach((m, idx) => {
                                        const ageDisplay = m.age || '未填寫';
                                        const roleBadge = m.role && m.role.trim() !== '' ? `<span class="ml-2 px-2 py-0.5 bg-amber-100 text-amber-700 text-[10px] font-bold rounded-md whitespace-nowrap inline-flex items-center gap-1 shadow-sm"><i data-lucide="award" class="w-3 h-3"></i>${m.role}</span>` : '';
                                        memHtml += `
                                            <div class="flex items-center p-4 bg-white/60 hover:bg-white/90 rounded-2xl group transition-all shadow-sm border border-white/50 mb-2 last:mb-0">
                                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-100 to-indigo-100 flex items-center justify-center mr-4 font-black text-indigo-500 shadow-inner shrink-0">
                                                    ${m.name.charAt(0)}
                                                </div>
                                                <div class="flex flex-col">
                                                    <span class="font-black text-slate-800 text-base leading-tight flex items-center flex-wrap gap-y-1">${m.name} ${roleBadge}</span>
                                                    <span class="text-[10px] text-slate-400 flex items-center mt-1.5 font-bold tracking-wide">
                                                        <i data-lucide="briefcase" class="w-3 h-3 mr-1"></i> ${m.job}
                                                        <span class="mx-2 text-slate-200">|</span>
                                                        <i data-lucide="user-square-2" class="w-3 h-3 mr-1"></i> ${ageDisplay}
                                                    </span>
                                                </div>
                                                <button 
                                                    onclick="openModal('edit-member', '${sub.id}', ${idx})"
                                                    class="ml-auto p-2.5 opacity-0 group-hover:opacity-100 bg-white hover:bg-purple-600 hover:text-white text-slate-400 rounded-xl shadow-sm transition-all"
                                                >
                                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        `;
                                    });
                                }
                            }

                            subHtml += `
                                <div class="rounded-3xl overflow-hidden border border-white/50 bg-white/20 mb-3 last:mb-0">
                                    <div class="flex items-center group">
                                        <div 
                                            onclick="toggleNode('${sub.id}')"
                                            class="flex-grow flex items-center p-4 cursor-pointer hover:bg-white/40 transition-all"
                                        >
                                            <div class="p-2 bg-white/80 rounded-xl mr-3 shadow-sm">
                                                <i data-lucide="building-2" class="w-4 h-4 text-indigo-400"></i>
                                            </div>
                                            <span class="font-bold text-slate-700">${sub.name}</span>
                                            <span class="ml-2 text-[10px] bg-white/60 text-slate-400 px-2 py-0.5 rounded-full font-black">${memCount}</span>
                                            <div class="ml-auto text-slate-300">
                                                ${subExp ? '<i data-lucide="chevron-down" class="w-4 h-4"></i>' : '<i data-lucide="chevron-right" class="w-4 h-4"></i>'}
                                            </div>
                                        </div>
                                        <button 
                                            onclick="openModal('add-member', '${sub.id}')"
                                            class="p-4 text-slate-300 hover:text-indigo-500 transition-colors"
                                        >
                                            <i data-lucide="plus" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                    ${subExp ? `<div class="px-4 pb-4 animate-in fade-in duration-300">${memHtml}</div>` : ''}
                                </div>
                            `;
                        });
                    }
                }

                htmlStr += `
                    <div class="glass rounded-[2.5rem] shadow-xl border-white/80 overflow-hidden">
                        <div 
                            onclick="toggleNode('${branch.id}')"
                            class="flex items-center p-6 cursor-pointer transition-all ${isExp ? 'bg-gradient-to-r from-purple-500 to-indigo-600 text-white' : 'hover:bg-white/40'}"
                        >
                            <div class="p-3 rounded-2xl mr-4 ${isExp ? 'bg-white/20' : 'bg-purple-100 text-purple-600'}">
                                <i data-lucide="map-pin" class="w-6 h-6"></i>
                            </div>
                            <div class="flex-grow">
                                <h2 class="text-xl font-black tracking-tight">${branch.name}</h2>
                                <p class="text-[10px] font-bold uppercase tracking-widest ${isExp ? 'text-purple-100' : 'text-slate-400'}">
                                    ${branch.children.length} 支會 • ${total} 人員
                                </p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button 
                                    onclick="event.stopPropagation(); openModal('add-sub-branch', '${branch.id}');"
                                    class="p-2 rounded-xl transition-all ${isExp ? 'hover:bg-white/20 text-white' : 'hover:bg-purple-50 text-purple-400'}"
                                >
                                    <i data-lucide="plus" class="w-5 h-5"></i>
                                </button>
                                <div class="opacity-50">
                                    ${isExp ? '<i data-lucide="chevron-down" class="w-5 h-5"></i>' : '<i data-lucide="chevron-right" class="w-5 h-5"></i>'}
                                </div>
                            </div>
                        </div>
                        ${isExp ? `<div class="p-4 animate-in fade-in duration-300">${subHtml}</div>` : ''}
                    </div>
                `;
            });

            container.innerHTML = htmlStr;
            lucide.createIcons(); // 每次重新渲染後必須重新呼叫生成 Icon
        }
    </script>
</body>
</html>
